name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PROJECT: PredatorControlApp/PredatorControlApp.csproj

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build (Debug)
        run: dotnet build ${{ env.PROJECT }} -c Debug

      # SelfCheck only runs in Debug builds; a failed assert kills the process with a non-zero exit code.
      - name: Run self-checks
        shell: pwsh
        run: |
          $exe = "PredatorControlApp/bin/Debug/net10.0-windows/PredatorControlApp.exe"
          $p = Start-Process $exe -ArgumentList '--selfcheck' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-checks failed (exit code $($p.ExitCode))" }
          Write-Host "Self-checks passed"

      # Runs the whole fan load test at 2% speed with fake sensors and checks the report zip.
      - name: Fan test smoke run
        shell: pwsh
        run: |
          $exe = "PredatorControlApp/bin/Debug/net10.0-windows/PredatorControlApp.exe"
          $p = Start-Process $exe -ArgumentList '--fantest-smoke' -Wait -PassThru
          $logs = Join-Path $env:LOCALAPPDATA "PredatorControl/logs"
          $err = Join-Path $logs "smoke-error.txt"
          if (Test-Path $err) { Get-Content $err }
          $zip = Get-ChildItem $logs -Filter "PredatorFanReport-*.zip" | Sort-Object LastWriteTime | Select-Object -Last 1
          if ($zip) {
            Expand-Archive $zip.FullName -DestinationPath smoke-report -Force
            Get-ChildItem smoke-report | Format-Table Name, Length
            Get-Content smoke-report/summary.txt
            Get-Content (Get-ChildItem smoke-report -Filter "fantest-*.csv").FullName -TotalCount 12
          }
          if ($p.ExitCode -ne 0) { throw "Fan test smoke run failed (exit code $($p.ExitCode))" }

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish $env:PROJECT -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true -o out/light
          dotnet publish $env:PROJECT -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
            -o out/standalone
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item out/light/PredatorControlApp.exe dist/PredatorControl.exe
          Copy-Item out/standalone/PredatorControlApp.exe dist/PredatorControl-standalone.exe
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: PredatorControl-build-${{ github.run_number }}
          path: dist/
